[package]
name = "astraea-cosmic-applet"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Astraea agenda applet for COSMIC: D-Bus client and state model (panel UI pending stable libcosmic packaging)."
homepage = "https://github.com/Lwb89dev/astraea"
rust-version = "1.85"

# libcosmic is deliberately NOT a dependency yet: it is git-only, its API
# moves with every COSMIC alpha, and pinning a moving git revision here
# would rot instantly. This crate ships the parts that are stable — the
# D-Bus client and the applet state model, both tested — plus a terminal
# frontend proving the client against the live service. The panel UI plugs
# into state::AppletState when libcosmic is packaged (docs/cosmic-applet.md).

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"

[lints.clippy]
unwrap_used = "warn"
