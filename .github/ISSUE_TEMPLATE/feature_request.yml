name: Feature request
description: Propose an improvement to Astraea.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not only the interface.
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and offline impact
      description: Does this add network access, storage, permissions, tracking or a third-party service?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and proposals.
          required: true
        - label: The proposal preserves useful offline behavior, or explains why it cannot.
          required: true
