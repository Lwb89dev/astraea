org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some third-party Flutter plugins (e.g. flutter_timezone) compile their
# Java at 11 but leave Kotlin at the 1.8 default, which AGP now rejects as an
# "Inconsistent JVM-target compatibility" error. We separately force a
# consistent JVM 17 target on every subproject (see android/build.gradle.kts);
# this downgrades the check itself from a hard failure to a warning so a
# newly-added plugin with the same quirk can't break the build.
kotlin.jvm.target.validation.mode=warning
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
